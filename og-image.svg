<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4f0"/>
      <stop offset="100%" style="stop-color:#f8f0ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Pink accent bar -->
  <rect x="0" y="0" width="1200" height="10" fill="#e91e8c"/>
  <!-- Main emoji -->
  <text x="600" y="220" font-size="120" text-anchor="middle" dominant-baseline="middle">💅</text>
  <!-- Title -->
  <text x="600" y="320" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="#c2166f" text-anchor="middle">BeautyBot</text>
  <!-- Subtitle -->
  <text x="600" y="395" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="30" fill="#666" text-anchor="middle">Find nail salons, hair salons &amp; more near you</text>
  <!-- Tag line -->
  <text x="600" y="450" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="24" fill="#e91e8c" text-anchor="middle">Free · On Telegram · No sign-up needed</text>
  <!-- Services row -->
  <text x="600" y="530" font-size="40" text-anchor="middle">💅 💇‍♀️ 🤨 👁️ ✨ 💆‍♀️ 💄</text>
</svg>
